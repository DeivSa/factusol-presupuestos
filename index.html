<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de presupuestos — Factusol</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #1a1a1a; font-size: 15px; line-height: 1.6; }
  .container { max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  h1 { font-size: 20px; font-weight: 500; margin-bottom: 0.25rem; }
  .subtitle { font-size: 13px; color: #666; margin-bottom: 2rem; }
  .card { background: #fff; border: 1px solid #e5e5e2; border-radius: 12px; padding: 1.25rem 1.5rem; margin-bottom: 1.25rem; }
  label { font-size: 13px; color: #555; display: block; margin-bottom: 5px; }
  textarea { width: 100%; min-height: 150px; font-size: 13px; font-family: 'Courier New', monospace; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; resize: vertical; line-height: 1.7; color: #1a1a1a; background: #fafaf9; }
  textarea:focus { outline: none; border-color: #999; background: #fff; }
  input[type="text"], input[type="number"] { font-size: 14px; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; width: 100%; color: #1a1a1a; background: #fafaf9; }
  input:focus { outline: none; border-color: #999; background: #fff; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .field { flex: 1; min-width: 150px; display: flex; flex-direction: column; gap: 4px; }
  .radio-group { display: flex; gap: 1.5rem; margin-bottom: 1rem; }
  .radio-group label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 14px; color: #1a1a1a; margin: 0; }
  .btn-primary { background: #1a1a1a; color: #fff; border: none; padding: 10px 22px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .btn-primary:hover { background: #333; }
  .btn-secondary { background: transparent; color: #1a1a1a; border: 1px solid #ccc; padding: 10px 22px; border-radius: 8px; font-size: 14px; cursor: pointer; }
  .btn-secondary:hover { background: #f5f5f3; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .detected-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 12px; background: #f5f5f3; border-radius: 8px; margin-bottom: 1rem; font-size: 13px; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; }
  .tag-yes { background: #d4f0d4; color: #1a5c1a; }
  .tag-no { background: #fde8e8; color: #8c1c1c; }
  .tag-neutral { background: #e8e8e5; color: #555; }
  .tag-warn { background: #fff3cd; color: #7a5800; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; font-weight: 600; color: #888; padding: 8px 10px; border-bottom: 1px solid #e5e5e2; text-transform: uppercase; letter-spacing: 0.05em; }
  td { padding: 5px 10px; border-bottom: 1px solid #f0f0ee; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr.blank-row td { background: #fafaf9; color: #aaa; font-size: 11px; font-style: italic; padding: 3px 10px; }
  tr.price-row td { font-weight: 500; background: #f9f9f7; }
  .editable-cell { border: none; background: transparent; font-size: 13px; color: #1a1a1a; font-family: inherit; width: 100%; padding: 1px 2px; }
  .editable-cell:focus { outline: 1px solid #999; border-radius: 3px; background: #fff; }
  .num-cell { width: 80px; text-align: right; }
  .obs-area { width: 100%; font-size: 13px; font-family: inherit; padding: 8px 10px; border: 1px solid #e5e5e2; border-radius: 8px; resize: vertical; min-height: 60px; color: #1a1a1a; background: #fafaf9; margin-top: 0.75rem; }
  .obs-area:focus { outline: none; border-color: #999; background: #fff; }
  .preview-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .preview-header h2 { font-size: 15px; font-weight: 500; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; }
  .badge-pre { background: #dbeafe; color: #1e40af; }
  .badge-pro { background: #fef3c7; color: #92400e; }
  .note { font-size: 12px; color: #888; margin-top: 8px; }
  #preview-section { display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>Generador de presupuestos</h1>
  <p class="subtitle">Convierte emails y WhatsApps en archivos listos para importar en Factusol</p>
  <div class="card">
    <div class="radio-group">
      <label><input type="radio" name="tipo" value="presupuesto" checked> Presupuesto</label>
      <label><input type="radio" name="tipo" value="proforma"> Factura proforma</label>
    </div>
    <div style="margin-bottom: 1rem;">
      <label>Pega aquí el texto del email o WhatsApp</label>
      <textarea id="input-text" placeholder="Para presupuesto a Blackout Works:&#10;Estanterías Mecalux segunda mano&#10;14 Largueros de 2.700mm (100x50)&#10;6 Bastidores de 4m&#10;6 protecciones&#10;Porte&#10;540€ + IVA&#10;Transporte incluido. Montaje no incluido."></textarea>
    </div>
    <div class="row">
      <div class="field">
        <label>Código de cliente en Factusol</label>
        <input type="text" id="cod-cliente" placeholder="Ej: 3961">
      </div>
      <div class="field">
        <label>Número de documento</label>
        <input type="number" id="num-doc" placeholder="Ej: 260055">
      </div>
      <div class="field">
        <label>Fecha</label>
        <input type="text" id="fecha-doc" placeholder="DD/MM/AAAA">
      </div>
    </div>
  </div>
  <div class="btn-row" style="margin-bottom: 1.5rem;">
    <button class="btn-primary" onclick="parsear()">Generar vista previa</button>
    <button class="btn-secondary" onclick="limpiar()">Limpiar</button>
  </div>
  <div id="preview-section">
    <div id="detected-row" class="detected-row"></div>
    <div class="card">
      <div class="preview-header">
        <h2>Líneas del documento</h2>
        <span id="badge-tipo" class="badge badge-pre">Presupuesto</span>
      </div>
      <table>
        <thead>
          <tr>
            <th style="width:32px;">#</th>
            <th>Descripción</th>
            <th style="width:72px;text-align:right;">Cant.</th>
            <th style="width:96px;text-align:right;">Precio €</th>
          </tr>
        </thead>
        <tbody id="preview-tbody"></tbody>
      </table>
      <div style="margin-top: 1rem;">
        <label>Observaciones (pie del documento)</label>
        <textarea class="obs-area" id="obs-area"></textarea>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" onclick="exportar()">Descargar PRE.xls y LPS.xls</button>
    </div>
    <p class="note">Importa ambos archivos en Factusol: Utilidades → Importaciones → Ficheros .XLSX/.XLS</p>
  </div>
</div>
<script>
let lineas = [];
function hoy() {
  const d = new Date();
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}
document.getElementById('fecha-doc').value = hoy();
function detectarTipo(t) {
  if (/facturar|proforma/i.test(t)) return 'proforma';
  if (/presupuesto|presu/i.test(t)) return 'presupuesto';
  return document.querySelector('input[name="tipo"]:checked').value;
}
function extraerPrecio(linea) {
  const m = linea.match(/(\d[\d.]*(?:,\d{1,2})?)\s*€/);
  if (!m) return null;
  return parseFloat(m[1].replace(/\./g,'').replace(',','.'));
}
function extraerCliente(texto) {
  const m = texto.match(/(?:facturar a|presupuesto a|para)\s+([^\n:]+)/i);
  return m ? m[1].trim() : '';
}
function detectarTM(texto) {
  let t = null, m = null;
  if (/transport\w*\s+y\s+montaje\s+no\s+inclui/i.test(texto)) { t=false; m=false; }
  else if (/transport\w*\s+y\s+montaje\s+inclui/i.test(texto)) { t=true; m=true; }
  else if (/montaje\s+y\s+transport\w*\s+no\s+inclui/i.test(texto)) { t=false; m=false; }
  else if (/montaje\s+y\s+transport\w*\s+inclui/i.test(texto)) { t=true; m=true; }
  for (const l of texto.split('\n')) {
    if (/transport|porte/i.test(l) && t===null) t = /no\s+inclui/i.test(l) ? false : /inclui/i.test(l) ? true : null;
    if (/montaje|instalaci[oó]n/i.test(l) && m===null) m = /no\s+inclui/i.test(l) ? false : /inclui/i.test(l) ? true : null;
  }
  return { t, m };
}
function esObs(linea) {
  return /(?:transport\w*|porte\w*|montaje|instalaci[oó]n)\s+(?:\w+\s+)?(?:no\s+)?inclui/i.test(linea);
}
function construirObs(t, m, conIVA) {
  const p = [];
  if (t===true && m===true) p.push('Transporte y montaje incluidos.');
  else if (t===false && m===false) p.push('Transporte y montaje no incluidos.');
  else {
    if (t===true) p.push('Transporte incluido.');
    else if (t===false) p.push('Transporte no incluido.');
    if (m===true) p.push('Montaje incluido.');
    else if (m===false) p.push('Montaje no incluido.');
  }
  if (!conIVA) p.push('IVA no incluido.');
  p.push('Precios válidos para 30 días.');
  return p.join(' ');
}
function tag(txt, cls) { return '<span class="tag '+cls+'">'+txt+'</span>'; }
function parsear() {
  const texto = document.getElementById('input-text').value.trim();
  if (!texto) return;
  const tipo = detectarTipo(texto);
  document.querySelector('input[name="tipo"][value="'+tipo+'"]').checked = true;
  const cliente = extraerCliente(texto);
  const { t, m } = detectarTM(texto);
  const conIVA = /\+\s*iva/i.test(texto);
  const todasLineas = texto.split('\n').map(l=>l.trim()).filter(Boolean);
  let precioTotal = null, descGen = '', mats = [], first = true;
  for (const linea of todasLineas) {
    if (first && /(?:facturar a|presupuesto a|para)\s+/i.test(linea)) { first=false; continue; }
    first = false;
    if (esObs(linea)) continue;
    const precio = extraerPrecio(linea);
    if (precio !== null && precioTotal === null) { precioTotal = precio; continue; }
    if (!descGen && mats.length===0) descGen = linea;
    else mats.push(linea);
  }
  lineas = [];
  const pd = descGen || (mats.length>0 ? mats.shift() : 'Material');
  lineas.push({ desc: pd, cantidad: 1, precio: precioTotal||0, esPrecio: true });
  for (const mat of mats) {
    lineas.push({ esBlanco: true });
    lineas.push({ desc: mat, cantidad: 0, precio: 0 });
  }
  const dr = document.getElementById('detected-row');
  dr.innerHTML = '<span style="font-size:12px;color:#888;margin-right:4px;">Detectado:</span>'
    + tag(tipo==='proforma'?'Proforma':'Presupuesto', tipo==='proforma'?'tag-warn':'tag-yes')
    + (cliente ? tag('Cliente: '+cliente,'tag-neutral') : '')
    + tag('Transporte: '+(t===true?'incluido':t===false?'no incluido':'?'), t===true?'tag-yes':t===false?'tag-no':'tag-neutral')
    + tag('Montaje: '+(m===true?'incluido':m===false?'no incluido':'?'), m===true?'tag-yes':m===false?'tag-no':'tag-neutral')
    + tag(conIVA?'+ IVA':'IVA incluido', 'tag-neutral');
  const badge = document.getElementById('badge-tipo');
  badge.textContent = tipo==='proforma'?'Factura proforma':'Presupuesto';
  badge.className = 'badge '+(tipo==='proforma'?'badge-pro':'badge-pre');
  const tbody = document.getElementById('preview-tbody');
  tbody.innerHTML = '';
  lineas.forEach((l,i) => {
    const tr = document.createElement('tr');
    if (l.esBlanco) {
      tr.className='blank-row';
      tr.innerHTML='<td>'+(i+1)+'</td><td colspan="3">— línea en blanco —</td>';
    } else {
      if (l.esPrecio) tr.className='price-row';
      const desc = (l.desc||'').replace(/"/g,'&quot;').replace(/</g,'&lt;');
      tr.innerHTML='<td style="color:#aaa;">'+(i+1)+'</td>'
        +'<td><input class="editable-cell" value="'+desc+'" onchange="lineas['+i+'].desc=this.value"></td>'
        +'<td><input class="editable-cell num-cell" type="number" value="'+l.cantidad+'" onchange="lineas['+i+'].cantidad=parseFloat(this.value)||0"></td>'
        +'<td><input class="editable-cell num-cell" type="number" step="0.01" value="'+l.precio+'" onchange="lineas['+i+'].precio=parseFloat(this.value)||0"></td>';
    }
    tbody.appendChild(tr);
  });
  document.getElementById('obs-area').value = construirObs(t, m, conIVA);
  document.getElementById('preview-section').style.display='block';
  document.getElementById('preview-section').scrollIntoView({behavior:'smooth',block:'start'});
}
function limpiar() {
  document.getElementById('input-text').value='';
  document.getElementById('cod-cliente').value='';
  document.getElementById('num-doc').value='';
  document.getElementById('fecha-doc').value=hoy();
  document.getElementById('preview-section').style.display='none';
  lineas=[];
}
function exportar() {
  const numDoc = parseInt(document.getElementById('num-doc').value)||1;
  const fecha = document.getElementById('fecha-doc').value||hoy();
  const codCliente = document.getElementById('cod-cliente').value||'';
  const obs = document.getElementById('obs-area').value||'';
  const precioTotal = (lineas.find(l=>l.esPrecio)||{}).precio||0;
  const preRow = new Array(100).fill('');
  preRow[0]='P'; preRow[1]=numDoc; preRow[3]=fecha;
  preRow[6]=codCliente?parseInt(codCliente):'';
  preRow[17]=precioTotal; preRow[74]=obs;
  const wbPre = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wbPre, XLSX.utils.aoa_to_sheet([preRow]), 'PRE');
  XLSX.writeFile(wbPre,'PRE.xls',{bookType:'xls'});
  const lpsRows = lineas.map((l,i)=>{
    const row = new Array(25).fill('');
    row[0]='P'; row[1]=numDoc; row[2]=i+1;
    row[4]=l.esBlanco?'':(l.desc||'');
    row[5]=l.esBlanco?0:l.cantidad;
    row[9]=l.esBlanco?0:l.precio;
    row[10]=l.esBlanco?0:((l.cantidad||0)*(l.precio||0));
    return row;
  });
  const wbLps = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wbLps, XLSX.utils.aoa_to_sheet(lpsRows), 'LPS');
  XLSX.writeFile(wbLps,'LPS.xls',{bookType:'xls'});
}
</script>
</body>
</html>
